<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The feed carries strings a stranger wrote on chain. Nothing here loads code from anywhere but this page. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>assay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   assay — instrument

   Every tool on Robinhood Chain wears the chain's own brand: #CCFF00 on black,
   pill radii, Instrument Serif. Pons does, bodkin does. Wearing it is not a
   look, it is camouflage. So this interface has NO accent hue at all: the
   chrome is black through white, zero radius, hairlines only, and the only
   colour that ever appears on screen is the three risk states — on the numbers
   they describe and nowhere else.
   ========================================================================== */
:root{
  /* neutrals, faintly cool, never pure grey. Steps are non-linear on purpose. */
  --n-990: oklch(11%   0.006 240);
  --n-960: oklch(14.5% 0.007 240);
  --n-930: oklch(18%   0.008 240);
  --n-900: oklch(22%   0.009 240);
  --n-800: oklch(29%   0.010 240);
  --n-600: oklch(45%   0.010 240);
  /* pinned: --ink-subtle has to clear 4.5:1 on --surface-2, the deepest ground it sits on */
  --n-500: oklch(62%   0.009 240);
  --n-350: oklch(75%   0.006 240);
  --n-100: oklch(93%   0.003 240);
  --n-000: oklch(99%   0.001 240);

  --bg:        var(--n-990);
  --surface:   var(--n-960);
  --surface-2: var(--n-930);
  --surface-3: var(--n-900);
  --line:      oklch(100% 0 0 / 9%);
  --line-hard: oklch(100% 0 0 / 17%);
  --ink:       var(--n-000);
  --ink-2:     var(--n-350);
  --ink-3:     var(--n-500);

  /* interaction is white. that is the whole accent system. */
  --hot:      var(--n-000);
  --hot-ink:  var(--n-990);

  /* the only colour in the product. risk states, on data. */
  --ok:   oklch(76% 0.16 152);
  --warn: oklch(82% 0.15 82);
  --crit: oklch(70% 0.20 27);
  --ok-w:   oklch(76% 0.16 152 / 14%);
  --warn-w: oklch(82% 0.15 82 / 14%);
  --crit-w: oklch(70% 0.20 27 / 15%);

  /* Golos Text and Geist Mono both ship Cyrillic; Archivo does not, and every Russian
     string would have silently fallen back to a system face. Checked, not assumed. */
  --ui:   "Golos Text", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px;
  --row:30px; --topbar:46px; --ribbon:34px;
  --fast:80ms;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--ui); font-size:13px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; overflow:hidden;   /* app shell: panes scroll, page never does */
}
/* nothing on this page is rounded. that is the statement. */
button,input,.box{border-radius:0}
.n{font-family:var(--mono); font-variant-numeric:tabular-nums slashed-zero}
.lbl{font-size:10px; font-weight:600; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3)}
:focus-visible{outline:2px solid var(--hot); outline-offset:-2px}

/* ---- masthead ----------------------------------------------------------- */
.top{
  flex:none; min-height:var(--topbar); display:flex; align-items:center; gap:var(--s4);
  padding:0 var(--s4); border-bottom:1px solid var(--line-hard); background:var(--surface);
  flex-wrap:wrap;
}
.mark{font-weight:600; font-size:15px; letter-spacing:-.02em}
.mark span{color:var(--ink-3); font-weight:400}
.tag{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase;
  padding:2px 7px; border:1px solid var(--line-hard); color:var(--ink-2); white-space:nowrap;
}
.tag.crit{background:var(--crit); border-color:var(--crit); color:oklch(17% 0.03 27); font-weight:600}
.tag.ok{background:var(--ok); border-color:var(--ok); color:oklch(17% 0.03 152); font-weight:600}
.spring{flex:1}
.beat{width:5px; height:5px; border-radius:50%; background:var(--n-800); flex:none; transition:background var(--fast)}
.beat.on{background:var(--ok)}

button{
  font:inherit; font-family:var(--ui); font-size:12px; font-weight:500;
  background:transparent; color:var(--ink); border:1px solid var(--line-hard);
  padding:5px 13px; cursor:pointer; transition:background var(--fast), border-color var(--fast);
}
button:hover{background:var(--surface-3); border-color:var(--hot)}
button.solid{background:var(--hot); color:var(--hot-ink); border-color:var(--hot); font-weight:600}
button.solid:hover{background:var(--n-100)}
button.mini{padding:2px 8px; font-size:11px}
button:disabled{opacity:.4; cursor:not-allowed}

/* ---- the activity ribbon -------------------------------------------------
   The one thing neither competitor shows: this chain lands ~40 launches a
   minute in bursts. A number cannot show a burst; ninety seconds of history can. */
.ribbon{
  flex:none; height:var(--ribbon); display:flex; align-items:stretch;
  border-bottom:1px solid var(--line); background:var(--bg);
}
.ribbon canvas{display:block; flex:1; height:100%; width:100%; min-width:0}
.ribbon-cap{align-self:center; padding:0 var(--s3); flex:none; border-right:1px solid var(--line); line-height:var(--ribbon)}
.readout{
  display:flex; align-items:center; gap:var(--s5); padding:0 var(--s4);
  border-left:1px solid var(--line); flex:none;
}
.readout .cell{display:flex; align-items:baseline; gap:6px}
.readout .v{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:13px; font-weight:500}

/* ---- shell -------------------------------------------------------------- */
.shell{flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 300px}
main{display:flex; flex-direction:column; min-width:0; min-height:0}

.bar{
  flex:none; display:flex; align-items:center; gap:var(--s2); flex-wrap:wrap;
  padding:var(--s2) var(--s4); border-bottom:1px solid var(--line);
}
.seg{display:flex; border:1px solid var(--line-hard)}
.seg button{border:0; padding:3px 11px; color:var(--ink-3); font-size:11.5px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--hot); color:var(--hot-ink); font-weight:600}
input[type=search],input[type=number]{
  font:inherit; font-family:var(--mono); font-size:11.5px;
  background:var(--bg); color:var(--ink); border:1px solid var(--line-hard); padding:4px 8px;
}
input[type=search]{width:190px}
input[type=search]::placeholder{color:var(--ink-3)}

/* ---- table -------------------------------------------------------------- */
.pane{flex:1; min-height:0; overflow:auto; overscroll-behavior:contain}
table{width:100%; border-collapse:collapse; min-width:980px}
thead th{
  position:sticky; top:0; z-index:9; background:var(--bg);
  border-bottom:1px solid var(--line-hard); text-align:left; white-space:nowrap;
  padding:6px var(--s3);
  font-size:10px; font-weight:600; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3);
}
thead th.r{text-align:right}
tbody tr.row{height:var(--row); border-bottom:1px solid var(--line); cursor:pointer}
tbody tr.row:hover{background:var(--surface)}
tbody tr.row[aria-expanded="true"]{background:var(--surface-2)}
td{padding:0 var(--s3); white-space:nowrap; vertical-align:middle}
td.r{text-align:right}

/* verdict reads as shape first, colour second */
td.mk{width:22px; padding:0 0 0 var(--s3); position:relative}
td.mk i{display:block; width:7px; height:7px; border:1.5px solid var(--n-600)}
tr.v-FIRE td.mk i{background:var(--ok); border-color:var(--ok)}
tr.v-WATCH td.mk i{border-color:var(--warn); background:transparent}
tr.v-SKIP  td.mk i{border-color:var(--n-800); background:transparent}
tr.v-SKIP{color:var(--ink-2)}

.sc{font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:500; font-size:13px}
tr.v-FIRE .sc{color:var(--ok)}
tr.v-WATCH .sc{color:var(--warn)}
tr.v-SKIP .sc{color:var(--ink-3)}

.who{max-width:1px; width:32%; overflow:hidden; text-overflow:ellipsis}
.tick{font-family:var(--mono); font-weight:500; color:var(--ink)}
.nm{color:var(--ink-3); margin-left:7px; font-size:12px}

.q{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12px; padding:1px 5px}
.q.ok{color:var(--ok)}
.q.warn{color:var(--warn); background:var(--warn-w)}
.q.crit{color:var(--crit); background:var(--crit-w)}
.q.nil{color:var(--ink-3)}
.q.unk{color:var(--crit); border-bottom:1px dashed currentColor}

.pair{font-family:var(--mono); font-size:11px; color:var(--ink-3)}
.cell-dim{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:11px; color:var(--ink-3)}
.t-dim{color:var(--ink-3)} .t-warn{color:var(--warn)} .t-crit{color:var(--crit)}
.tag.sm{padding:1px 5px}
.pos-act{margin-top:var(--s2)}
.pair.alt{color:var(--warn)}

.fill{display:flex; align-items:center; gap:7px; justify-content:flex-end}
.fill .t{width:46px; height:2px; background:var(--n-800)}
.fill .t>i{display:block; height:100%; background:var(--ink-2)}
.fill .p{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:11px; color:var(--ink-3); width:30px; text-align:right}

/* the decay meter: only alive while the opening tax still is */
.decay{display:inline-flex; align-items:center; gap:5px}
.decay .t{width:34px; height:2px; background:var(--crit-w)}
.decay .t>i{display:block; height:100%; background:var(--crit); transition:width 120ms linear}
.decay .v{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:11px; color:var(--crit)}

.mini-flag{font-family:var(--mono); font-size:9.5px; letter-spacing:.05em; text-transform:uppercase;
  border:1px solid currentColor; padding:0 4px; margin-left:6px; color:var(--crit)}
.mini-flag.good{color:var(--ok)}

tr.detail>td{
  padding:var(--s3) var(--s4) var(--s4) 34px; background:var(--surface-2);
  border-bottom:1px solid var(--line-hard); white-space:normal;
}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:var(--s2) var(--s5)}
.kv{display:flex; gap:var(--s2); font-size:12px; line-height:1.55}
.kv dt{color:var(--ink-3); min-width:78px; flex:none}
.kv dd{margin:0; font-family:var(--mono); font-size:11.5px; overflow-wrap:anywhere}
.why{margin-top:var(--s3); font-size:11.5px; line-height:1.75; color:var(--ink-2)}
.why b{color:var(--ink); font-weight:500; font-family:var(--mono)}
.note{margin-top:var(--s2); font-size:11.5px; color:var(--warn)}
.blurb{margin:0 0 var(--s3); color:var(--ink-2); font-size:12px; max-width:80ch}
a{color:var(--ink); text-decoration:none; border-bottom:1px solid var(--line-hard)}
a:hover{border-bottom-color:var(--hot)}
.row-links{margin-top:var(--s3); display:flex; gap:var(--s4); font-size:11.5px; font-family:var(--mono)}

/* ---- rail --------------------------------------------------------------- */
/* The rail scrolls when it has to. Four sections fit a laptop; on a short window the log used to be
   squeezed to nothing instead of the rail simply being longer than the screen. */
.rail{border-left:1px solid var(--line-hard); background:var(--surface); display:flex; flex-direction:column;
  min-width:0; min-height:0; overflow:auto; overscroll-behavior:contain}
/* A section keeps its own height rather than being squeezed by the ones above it; only the last
   one stretches, and only down to a floor, so the log is always a log and not a sliver. */
.sec{border-bottom:1px solid var(--line); padding:var(--s3) var(--s4); flex:none}
.sec:last-child{flex:1; min-height:118px; display:flex; flex-direction:column; border-bottom:0}
.sec h2{margin:0 0 var(--s3); display:flex; align-items:center; gap:var(--s2); font-size:10px;
  font-weight:600; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3)}
.sec h2 .c{font-family:var(--mono); color:var(--ink-2)}

.pos{border:1px solid var(--line); background:var(--surface-2); padding:var(--s2) var(--s3); margin-bottom:var(--s2)}
.pos .hd{display:flex; align-items:baseline; gap:var(--s2)}
.pnl{font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600; font-size:12px; margin-left:auto}
.pnl.up{color:var(--ok)} .pnl.dn{color:var(--crit)}
.pos .sub{font-family:var(--mono); font-size:10.5px; color:var(--ink-3); margin-top:2px}

.rule{display:flex; align-items:center; gap:var(--s2); margin-bottom:6px}
.rule label{flex:1; font-size:11.5px; color:var(--ink-2)}
.rule input{width:62px; text-align:right}

/* ---- the record ----------------------------------------------------------
   A live feed is the one thing every scanner already has. Whether the score on
   the left of it has ever been right is the one thing none of them will tell
   you, so it sits in the rail at the same density as everything else. Nothing
   is dressed up: no rate appears without the sample it came from, and the only
   colour is on the bound that carries the claim. */
.pf-r{display:flex; align-items:baseline; gap:var(--s2); line-height:1.7}
.pf-r .k{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pf-r .s{flex:none; font-size:10.5px; color:var(--ink-3)}
.pf-r .p{flex:none; width:52px; text-align:right; font-size:11.5px}
.pf-r .x{flex:none; width:32px; text-align:right; font-size:10.5px; color:var(--ink-3)}
.pf-claim{
  margin-top:var(--s2); padding-top:var(--s2); border-top:1px solid var(--line);
  font-size:11.5px; line-height:1.6; color:var(--ink-2);
}
.pf-claim b{font-family:var(--mono); font-variant-numeric:tabular-nums slashed-zero; font-weight:500; color:var(--ink)}
.pf-split{margin-top:var(--s2); padding-top:var(--s2); border-top:1px solid var(--line)}
.pf-f{display:flex; align-items:baseline; gap:var(--s2); line-height:1.7; font-size:11.5px}
.pf-f .k{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-2)}
.pf-f .v{flex:none}
.pf-foot{margin-top:var(--s2); font-size:10.5px; line-height:1.5; color:var(--ink-3)}

#log{flex:1; min-height:70px; overflow:auto; font-family:var(--mono); font-size:10.5px; line-height:1.7; color:var(--ink-3)}
#log div{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#log time{color:var(--ink-3); margin-right:7px}
#log .g{color:var(--ok)} #log .r{color:var(--crit)}

.blank{color:var(--ink-3); font-size:12px; padding:var(--s5) 0; text-align:center}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ---- the walkthrough ------------------------------------------------------
   Points at the real controls instead of describing them in a wall of text. */
#veil{position:fixed; inset:0; z-index:60; background:oklch(8% 0.005 240 / 72%); display:none}
#veil.on{display:block}
#ring{position:fixed; z-index:61; border:1px solid var(--hot); box-shadow:0 0 0 9999px oklch(8% 0.005 240 / 72%);
  pointer-events:none; display:none; transition:top 140ms ease, left 140ms ease, width 140ms ease, height 140ms ease}
#ring.on{display:block}
#coach{position:fixed; z-index:62; max-width:330px; background:var(--surface-2);
  border:1px solid var(--line-hard); padding:var(--s4); display:none}
#coach.on{display:block}
#coach h3{margin:0 0 var(--s2); font-size:13px; font-weight:600}
#coach p{margin:0 0 var(--s3); font-size:12.5px; line-height:1.6; color:var(--ink-2); max-width:60ch}
#coach .foot{display:flex; align-items:center; gap:var(--s2)}
#coach .step{font-family:var(--mono); font-size:11px; color:var(--ink-3); margin-right:auto; white-space:nowrap}
.langs{display:flex; border:1px solid var(--line-hard)}
.langs button{border:0; padding:3px 8px; font-size:11px; color:var(--ink-3); font-family:var(--mono)}
.langs button[aria-pressed="true"]{background:var(--hot); color:var(--hot-ink); font-weight:600}
@media(max-width:720px){#coach{left:var(--s3) !important; right:var(--s3); max-width:none; width:auto}}

@media(max-width:1080px){
  .shell{grid-template-columns:minmax(0,1fr); overflow:auto}
  main{min-height:62vh}
  /* Below the feed the rail is not a pane of its own; the whole shell scrolls, so it must not
     become a 200px window with its own scrollbar inside a page that already scrolls. */
  .rail{border-left:0; border-top:1px solid var(--line-hard); overflow:visible}
  .sec:last-child{flex:none; min-height:0}
  #log{max-height:180px}
  .readout{display:none}
}
/* Measured on a phone: every control came out 22-29px tall. A finger needs 44.
   Keyed off the pointer rather than the width, so a touch laptop gets it too. */
@media (pointer: coarse){
  button{min-height:44px; padding:0 16px}
  button.mini{min-height:40px}
  .seg button{min-height:44px}
  input[type=search],input[type=number]{min-height:44px}
  .rule input{width:78px}
  tbody tr.row{height:42px}
}

@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>

<header class="top">
  <span class="mark">assay<span>/pons v2</span></span>
  <span class="tag" id="mode">…</span>
  <span class="tag" id="state">paused</span>
  <span class="spring"></span>
  <span class="beat" id="beat" title="engine heartbeat"></span>
  <div class="langs" role="group" aria-label="Language">
    <button data-lang="en" aria-pressed="true">EN</button>
    <button data-lang="ru" aria-pressed="false">RU</button>
  </div>
  <button id="help" data-i18n="help" title="Walk me through it">guide</button>
  <button id="toggle" class="solid">start</button>
</header>

<div class="ribbon">
  <span class="lbl ribbon-cap" data-i18n="ribbon">launches / sec · 90s</span>
  <canvas id="spark" aria-label="Launches per second over the last 90 seconds"></canvas>
  <div class="readout">
    <div class="cell"><span class="lbl" data-i18n="k_seen">seen</span><span class="v" id="k-seen">0</span></div>
    <div class="cell"><span class="lbl" data-i18n="k_rate">per min</span><span class="v" id="k-rate">0</span></div>
    <div class="cell"><span class="lbl" data-i18n="k_pass">passing</span><span class="v" id="k-pass">0</span></div>
    <div class="cell"><span class="lbl" data-i18n="k_open">open</span><span class="v" id="k-open">0</span></div>
    <div class="cell"><span class="lbl" data-i18n="k_spent">spent</span><span class="v" id="k-spent">0.0000</span></div>
  </div>
</div>

<div id="veil"></div>
<div id="ring"></div>
<div id="coach" role="dialog" aria-modal="false" aria-labelledby="coach-h">
  <h3 id="coach-h"></h3>
  <p id="coach-p"></p>
  <div class="foot">
    <span class="step" id="coach-n"></span>
    <button id="coach-skip"></button>
    <button id="coach-back"></button>
    <button id="coach-next" class="solid"></button>
  </div>
</div>

<div class="shell">
  <main>
    <div class="bar">
      <div class="seg" role="group" aria-label="Filter by verdict">
        <button data-f="all" aria-pressed="true" data-i18n="f_all">all</button>
        <button data-f="FIRE" aria-pressed="false" data-i18n="f_fire">fire</button>
        <button data-f="WATCH" aria-pressed="false" data-i18n="f_watch">watch</button>
        <button data-f="passing" aria-pressed="false" data-i18n="f_pass">passes rules</button>
      </div>
      <input type="search" id="q" data-i18n-ph="search" placeholder="symbol, name or address" aria-label="Filter launches">
      <span class="spring"></span>
      <span class="tag" id="link">connecting</span>
    </div>

    <div class="pane">
      <table>
        <caption class="sr">Live pons v2 launches, newest first</caption>
        <thead><tr>
          <th scope="col" aria-label="Verdict"></th>
          <th scope="col" class="r" data-i18n="c_score">score</th>
          <th scope="col" data-i18n="c_launch">launch</th>
          <th scope="col" class="r" data-i18n="c_buy">opening buy</th>
          <th scope="col" class="r" data-i18n="c_tax">tax</th>
          <th scope="col" class="r" data-i18n="c_exempt">exempt</th>
          <th scope="col" data-i18n="c_pair">pair</th>
          <th scope="col" class="r" data-i18n="c_curve">curve</th>
          <th scope="col" class="r" data-i18n="c_dev">deployer</th>
          <th scope="col" class="r" data-i18n="c_age">age</th>
        </tr></thead>
        <tbody id="feed"></tbody>
      </table>
      <div class="blank" id="blank">waiting for the first launch</div>
    </div>
  </main>

  <aside class="rail">
    <section class="sec">
      <h2><span data-i18n="s_pos">positions</span> <span class="c" id="pc">0</span></h2>
      <div id="positions"><div class="blank">none</div></div>
    </section>
    <section class="sec">
      <h2 data-i18n="s_rules">rules</h2>
      <div id="rules"></div>
    </section>

/* Missing keys fall through to English rather than showing the key itself, so a gap in a
   translation degrades to a readable page instead of to debug output. */
const t = (key, vars) => {
  let s = I18N[LANG][key] ?? I18N.en[key] ?? key;
  if (vars) for (const k of Object.keys(vars)) s = s.replaceAll("{" + k + "}", vars[k]);
  return s;
};

const rows = [];                       // newest first, for the age and decay ticks
const buckets = new Array(90).fill(0); // launches per second, last 90 s

/* Risk bands mirror the scoring rules, so a cell's colour and the score never
   disagree — and a value we could not read is never mistaken for a good one. */
/* `unk` is treated as badly as `crit` by the rules — a value nobody could read is never
   assumed to be fine — but it is drawn differently, so a failed read is distinguishable
   from a hostile token at a glance. */
const bBuy = (v) => v == null ? "unk" : v === 0 || v < 1 ? "nil" : v <= 6 ? "ok" : v <= 10 ? "warn" : "crit";
const bTax = (v) => v == null ? "unk" : v <= 200 ? "ok" : v <= 500 ? "warn" : "crit";
const bEx  = (n) => n == null ? "unk" : n === 0 ? "ok" : n <= 3 ? "warn" : "crit";

/* The number is the information and the colour only emphasises it, so nothing is lost to a
   colour-blind reader. The tooltip says the band anyway, for the reader who wants the rule. */
const why = (group, band) => t(`why_${group}_${band}`);

const shortAge = (ms) => {
  const s = Math.max(0, Math.round(ms / 1000));
  if (s < 60) return s + t("u_s");
  const m = Math.floor(s / 60);
  return m < 60 ? m + t("u_m") : Math.floor(m / 60) + t("u_h");
};

function say(text, cls) {
  const d = document.createElement("div");
  d.innerHTML = `<time>${clock(Date.now())}</time><span class="${cls || ""}">${esc(text)}</span>`;
  $("#log").prepend(d);
  while ($("#log").childElementCount > 140) $("#log").lastElementChild.remove();
}

/* ---- the ribbon --------------------------------------------------------- */
const cv = $("#spark"), cx = cv.getContext("2d");
function drawSpark() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  if (cv.width !== w * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cx.clearRect(0, 0, w, h);
  const peak = Math.max(3, ...buckets);
  const step = w / buckets.length;
  const css = getComputedStyle(document.documentElement);
  // baseline
  cx.strokeStyle = css.getPropertyValue("--line").trim() || "rgba(255,255,255,.09)";
  cx.lineWidth = 1;
  cx.beginPath(); cx.moveTo(0, h - 0.5); cx.lineTo(w, h - 0.5); cx.stroke();
  // a faint 15-second ruler, so a burst can be located in time and not just seen
  cx.strokeStyle = css.getPropertyValue("--line").trim() || "rgba(255,255,255,.09)";
  for (let t = 15; t < buckets.length; t += 15) {
    const x = Math.round(t * (w / buckets.length)) + 0.5;
    cx.beginPath(); cx.moveTo(x, h - 7); cx.lineTo(x, h); cx.stroke();
  }
  // bars, oldest at the left
  cx.fillStyle = css.getPropertyValue("--n-500").trim() || "#8a8f96";
  for (let i = 0; i < buckets.length; i++) {
    const v = buckets[i];
    if (!v) continue;
    const bh = Math.max(2, (v / peak) * (h - 8));
    cx.fillRect(i * step, h - bh - 1, Math.max(1.5, step - 1), bh);
  }
  // the newest second, so the live edge is legible
  const last = buckets[buckets.length - 1];
  if (last) {
    cx.fillStyle = css.getPropertyValue("--ink").trim() || "#fff";
    const bh = Math.max(2, (last / peak) * (h - 8));
    cx.fillRect((buckets.length - 1) * step, h - bh - 1, Math.max(1.5, step - 1), bh);
  }
}
setInterval(() => { buckets.shift(); buckets.push(0); drawSpark(); }, 1000);
addEventListener("resize", drawSpark);

function matches(e) {
  if (FILTER === "FIRE" && e.verdict !== "FIRE") return false;
  if (FILTER === "WATCH" && e.verdict !== "WATCH") return false;
  if (FILTER === "passing" && !e.fire) return false;
  if (!QUERY) return true;
  return `${e.symbol || ""} ${e.name || ""} ${e.token} ${e.deployer}`.toLowerCase().includes(QUERY);
}

    <td class="r"><span class="sc">${e.score}</span></td>
    <td class="who"><span class="tick">${esc(e.symbol ? "$" + e.symbol : e.token.slice(0, 10))}</span><span class="nm">${esc(e.name)}</span>${e.farmTwins ? `<span class="mini-flag">${esc(t("row_farm", { n: e.farmTwins }))}</span>` : ""}${e.fire ? `<span class="mini-flag good">${esc(t("row_passes"))}</span>` : ""}</td>
    <td class="r"><span class="q ${bBuy(e.devPct)}" title="${esc(why("buy", bBuy(e.devPct)))}">${e.devPct == null ? "?" : e.devPct.toFixed(2) + "%"}</span></td>
    <td class="r"><span class="q ${bTax(e.taxBps)}" title="${esc(why("tax", bTax(e.taxBps)))}">${e.taxBps == null ? "?" : e.taxBps / 100 + "%"}</span></td>
    <td class="r"><span class="q ${bEx(e.exempt ? e.exempt.length : null)}" title="${esc(why("ex", bEx(e.exempt ? e.exempt.length : null)))}">${e.exempt == null ? "?" : e.exempt.length}</span></td>
    <td><span class="pair ${e.pairNative ? "" : "alt"}">${esc(e.pair)}</span></td>
    <td class="r"><div class="fill"><div class="t"><i style="width:${pct.toFixed(0)}%"></i></div><span class="p">${pct.toFixed(0)}%</span></div></td>
    <td class="r"><span class="cell-dim">${dev}</span></td>
    <td class="r"><span class="cell-dim age">0s</span></td>`;

  let open = null;
  const toggle = () => {
    if (open) { open.remove(); open = null; tr.setAttribute("aria-expanded", "false"); return; }
    open = detailRow(e);
    tr.after(open);
    tr.setAttribute("aria-expanded", "true");
  };
  tr.addEventListener("click", toggle);
  tr.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); toggle(); } });
  tr._e = e;
  tr._detach = () => { if (open) { open.remove(); open = null; tr.setAttribute("aria-expanded", "false"); } };
  return tr;
}

function addLaunch(e) {
  seen++;
  if (e.fire) passing++;
  buckets[buckets.length - 1]++;
  drawSpark();
  $("#k-seen").textContent = seen;
  $("#k-pass").textContent = passing;

  const body = $("#feed");
  const tr = launchRow(e);
  if (!matches(e)) tr.hidden = true;
  body.prepend(tr);
  rows.unshift(tr);
  while (rows.length > 400) { const old = rows.pop(); old._detach(); old.remove(); }
  showEmpty();
}

/* One timer for every row instead of one per row. Ages only matter while a launch
   is young, so it stops re-rendering the tail. */
setInterval(() => {
  const now = Date.now();
  $("#k-rate").textContent = buckets.reduce((a, b) => a + b, 0);
  for (let i = 0; i < rows.length && i < 60; i++) {
    const tr = rows[i], e = tr._e;
    const el = tr.querySelector(".age");
    if (el) el.textContent = shortAge(now - e.at);

    // the opening tax, decaying for real rather than frozen at read time
    if (!e.launchedAt) continue;
    // The curve's launchedAt is the block's clock, not this machine's, and the two disagree by a
    // few seconds often enough to matter. Clamping keeps a skewed reading from drawing a bar past
    // full and a countdown longer than the window itself.
    const left = Math.min(TAX_SECONDS * 1000, e.launchedAt * 1000 + TAX_SECONDS * 1000 - now);
    let d = tr.querySelector(".decay");
    if (left > 0) {
      if (!d) {
        d = document.createElement("span");
        d.className = "decay";
        d.innerHTML = `<span class="t"><i></i></span><span class="v"></span>`;
        tr.querySelector(".who").append(d);
      }
      const frac = left / (TAX_SECONDS * 1000);
      d.querySelector("i").style.width = (frac * 100).toFixed(0) + "%";
      d.querySelector(".v").textContent = t("tax_left", { s: (left / 1000).toFixed(1) });
    } else if (d) d.remove();
  }
}, 200);

/* Three states, not two: nothing has arrived yet, everything arrived but the filter hides it,
   or there are rows. Collapsing the middle one into the first reads as a broken feed. */
function showEmpty() {
  const el = $("#blank");
  const visible = rows.some((tr) => !tr.hidden);
  el.hidden = visible;
  el.textContent = rows.length === 0 ? t("blank_wait") : t("blank_filter");
}

function applyFilter() {
  for (const tr of rows) {
    tr.hidden = !matches(tr._e);
    if (tr.hidden) tr._detach();   // a detail panel must never outlive the row it belongs to
  }
  showEmpty();
}

function renderPositions(list) {
  POSITIONS = list;
  const box = $("#positions");
  const open = list.filter((p) => p.status === "open");
  $("#pc").textContent = open.length;
  $("#k-open").textContent = open.length;
  if (!list.length) { box.innerHTML = `<div class="blank">${esc(t("none"))}</div>`; return; }
  box.innerHTML = "";
  for (const p of [...list].reverse().slice(0, 12)) {
    const el = document.createElement("div");
    el.className = "pos";
    const up = p.pnlPct >= 0;
    el.innerHTML = `
      <div class="hd">
        <span class="tick">$${esc(p.symbol)}</span>
        <span class="tag sm">${esc(t(p.status === "open" ? "ps_open" : "ps_closed"))}${p.dryRun ? " " + esc(t("ps_dry")) : ""}</span>
        <span class="pnl ${up ? "up" : "dn"}">${up ? "+" : ""}${p.pnlPct.toFixed(1)}%</span>
      </div>
      <div class="sub">${esc(t("pos_in", { x: (Number(p.entryQuote) / 10 ** p.pairDecimals).toFixed(4), pair: p.pair }))}${p.exits.length ? " · " + esc(p.exits[p.exits.length - 1].reason) : ""}</div>
      ${p.status === "open" && !FROZEN ? `<div class="pos-act"><button class="mini" data-close="${esc(p.id)}">${esc(t("close_now"))}</button></div>` : ""}`;
    box.append(el);
  }
  box.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", async (ev) => {
    ev.stopPropagation(); b.disabled = true;
    const r = await fetch("/close", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: b.dataset.close }) }).then((x) => x.json()).catch(() => ({ ok: false, error: t("log_req_failed") }));
    say(r.ok ? t("log_closed", { p: (r.pnlPct >= 0 ? "+" : "") + r.pnlPct.toFixed(1), v: r.venue }) : t("log_close_refused", { e: r.error }), r.ok ? "g" : "r");
  }));
}

function renderRules(rules) {
  RULES = rules;
  const box = $("#rules");
  box.innerHTML = "";
  for (const [key, value] of Object.entries(rules)) {
    const b = BOUNDS[key] || { min: 0, max: 1000 };
    const label = I18N[LANG]["r_" + key] ? t("r_" + key) : key.replace(/([A-Z])/g, " $1").toLowerCase().trim();
    const row = document.createElement("div");
    row.className = "rule";
    row.innerHTML = `<label for="r-${key}">${esc(label)}</label><input id="r-${key}" type="number" min="${b.min}" max="${b.max}" value="${value}"${FROZEN ? " disabled" : ""}>`;
    row.querySelector("input").addEventListener("change", async (ev) => {
      const r = await fetch("/rule", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ key, value: Number(ev.target.value) }) }).then((x) => x.json()).catch(() => ({ ok: false, error: t("log_req_failed") }));
      if (r.ok) { ev.target.value = r.value; RULES = { ...RULES, [key]: r.value }; say(t("log_rule", { k: label, v: r.value })); } else say(t("log_rule_refused", { e: r.error }), "r");
    });
    box.append(row);
  }
}

/* ---- the record ----------------------------------------------------------
   What the score has been worth, read out of this terminal's own journal. The
   claim is not the rate — a rate is something anyone can produce by choosing a
   kind window — it is that the 95% lower bound on the FIRE bucket clears the
   base rate everything else ran at. When it does not, the panel says so in the
   same place, with the sample it would take, rather than quietly showing the
   flattering number. */
const pctv = (x) => (Number(x) * 100).toFixed(2) + "%";
const numv = (n) => Number(n).toLocaleString(LANG === "ru" ? "ru-RU" : "en-US");
/* Values are numbers we formatted ourselves and the templates are our own dictionary, so this is
   the one place on the page that interpolates markup. Nothing from the chain reaches it. */
const fig = (v, cls) => `<b class="${cls || ""}">${esc(v)}</b>`;

const VERDICT_KEY = { FIRE: "f_fire", WATCH: "f_watch", SKIP: "pf_skip", all: "f_all" };

function renderStats(s) {
  STATS = s;
  const sec = $("#record");
  if (!s) { sec.hidden = true; return; }
  sec.hidden = false;

  const box = $("#rec");
  const overall = (s.buckets || []).find((b) => b.verdict === "all");
  const judged = overall ? overall.judged : 0;
  $("#rec-n").textContent = judged ? numv(judged) : "";

  if (!s.total || !judged) {
    box.innerHTML = `<div class="blank">${esc(t("pf_empty"))}</div><div class="pf-foot">${esc(t("pf_empty2"))}</div>`;
    return;
  }

  const fire = s.buckets.find((b) => b.verdict === "FIRE");
  const proven = !!fire && fire.judged > 0 && s.base > 0 && fire.floor > s.base;

  const table = s.buckets.map((b) => `<div class="pf-r">
      <span class="lbl k">${esc(t(VERDICT_KEY[b.verdict] || b.verdict))}</span>
      <span class="n s">${esc(numv(b.graduated))} / ${esc(numv(b.judged))}</span>
      <span class="n p${b.verdict === "FIRE" && proven ? " t-ok" : ""}">${b.judged ? esc(pctv(b.rate)) : "—"}</span>
      <span class="n x">${b.verdict === "all" || b.lift == null ? "—" : esc(b.lift.toFixed(1) + "×")}</span>
    </div>`).join("");

  let claim;
  if (proven) claim = t("pf_proven", { f: fig(pctv(fire.floor), "t-ok"), b: fig(pctv(s.base)) });
  else if (!s.base) claim = t("pf_nobase", { j: fig(numv(judged)) });
  else if (!fire || s.need == null || fire.judged < s.need) {
    claim = t("pf_unproven", { j: fig(numv(fire ? fire.judged : 0), "t-warn"), n: fig(s.need == null ? "?" : numv(s.need)) });
  } else claim = t("pf_notclear", { f: fig(pctv(fire.floor), "t-warn"), b: fig(pctv(s.base)) });

  const p = s.priced || {};
  const funnel = p.total
    ? [["pf_priced", p.total], ["pf_untraded", p.neverTraded], ["pf_entered", p.withEntry], ["pf_doubled", p.doubled]]
        .map(([k, v]) => `<div class="pf-f"><span class="k">${esc(t(k))}</span><span class="n v">${esc(numv(v))}</span></div>`).join("")
    : "";

  box.innerHTML = table
    + `<div class="pf-claim">${claim}</div>`
    + (funnel ? `<div class="pf-split">${funnel}</div>` : "")
    + `<div class="pf-foot">${esc(t("pf_foot", { h: s.matureHours, p: numv(s.pending) }))}</div>`;
}

/* An older board has no /stats, and a journal can be missing or unreadable. None of that is a
   reason for the rest of the page to stop, so the panel simply is not there. */
async function loadStats() {
  try {
    const r = await fetch("/stats");
    if (!r.ok) throw new Error(String(r.status));
    const s = await r.json();
    if (!s || typeof s !== "object" || !Array.isArray(s.buckets)) throw new Error("shape");
    renderStats(s);
    return true;
  } catch { renderStats(null); return false; }
}

function setPaused(p) {
  PAUSED = p;
  const st = $("#state");
  st.textContent = p ? t("st_paused") : LIVE ? t("st_armed") : t("st_running");
  st.className = "tag" + (p ? "" : LIVE ? " ok" : "");
  const b = $("#toggle");
  b.textContent = p ? (LIVE ? t("b_arm") : t("b_start")) : t("b_stop");
  b.className = p ? "solid" : "";
}

$("#toggle").addEventListener("click", async () => {
  const r = await fetch(PAUSED ? "/resume" : "/pause", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" }).then((x) => x.json());
  setPaused(r.paused);
});
document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => {
  FILTER = b.dataset.f;
  document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
  applyFilter();
}));
$("#q").addEventListener("input", (e) => { QUERY = e.target.value.trim().toLowerCase(); applyFilter(); });
document.addEventListener("keydown", (e) => {
  // Without the modifier guard, cmd+P and ctrl+P — print — were starting and stopping the engine.
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest("input, textarea, select, [contenteditable]")) { if (e.key === "Escape") e.target.blur(); return; }
  if (e.key === "p") { e.preventDefault(); $("#toggle").click(); }
  if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
});

async function boot() {
  const s = await fetch("/state").then((r) => r.json());
  LIVE = s.live; BOUNDS = s.bounds; FROZEN = s.readOnly === true;
  $("#toggle").hidden = FROZEN;
  if (s.taxSeconds) TAX_SECONDS = s.taxSeconds;
  $("#mode").textContent = FROZEN ? t("m_readonly") : LIVE ? t("m_live") : t("m_dry");
  $("#mode").className = "tag" + (LIVE && !FROZEN ? " crit" : "");
  setPaused(s.paused);
  renderRules(s.rules);
  renderPositions(s.positions);
  // Off the critical path: the journal is a big file and the feed should not wait on it. The
  // server caches it for minutes at a time, so re-asking occasionally is nearly free.
  void loadStats().then((ok) => { if (ok) setInterval(loadStats, 5 * 60 * 1000); });
  $("#k-spent").textContent = (Number(s.spent) / 1e18).toFixed(4);
  for (const e of s.recent) if (e.kind === "launch") addLaunch(e);
  drawSpark();
  LINK = "net_connected";
  $("#link").textContent = t(LINK);
  say(t("log_connected"));

  const src = new EventSource("/events");
  src.onopen = () => { LINK = "net_connected"; $("#link").textContent = t(LINK); };
  src.onmessage = (m) => {
    const e = JSON.parse(m.data);
    switch (e.kind) {
      case "launch": addLaunch(e); break;
      case "positions": renderPositions(e.positions); break;
      case "pulse":
        $("#beat").classList.add("on");
        setTimeout(() => $("#beat").classList.remove("on"), 450);
        $("#k-spent").textContent = (Number(e.spent) / 1e18).toFixed(4);
        $("#k-open").textContent = e.open;
        break;
      case "state": setPaused(e.paused); break;
      case "fire": say(t("log_fire", { s: e.symbol, t: (e.taxBps / 100).toFixed(2), ms: e.waitedMs }), "g"); break;
      case "exit": say(t("log_exit", { s: e.symbol, p: (e.pnlPct >= 0 ? "+" : "") + e.pnlPct.toFixed(1), r: e.reason }), e.pnlPct >= 0 ? "g" : "r"); break;
      case "hold": say(t("log_hold", { s: e.symbol, t: (e.taxBps / 100).toFixed(1) })); break;
      case "swept": say(t("log_swept", { s: e.symbol })); break;
      case "index": say(t("log_index", { l: e.launches, g: e.graduations })); break;
      case "error": say(`${e.where}: ${e.message}`, "r"); break;
    }
  };
  src.onerror = () => { LINK = "net_reconnecting"; $("#link").textContent = t(LINK); };
}

/* ---- language switching --------------------------------------------------
   Everything static is marked up with data-i18n; everything dynamic is re-rendered
   from the state we already keep, so switching languages never needs a reload and
   never loses the feed. */
function applyLang(lang) {
  LANG = I18N[lang] ? lang : "en";
  try { localStorage.setItem("assay.lang", LANG); } catch { /* nothing to do */ }
  document.documentElement.lang = LANG;

  for (const el of document.querySelectorAll("[data-i18n]")) el.textContent = t(el.dataset.i18n);
  for (const el of document.querySelectorAll("[data-i18n-ph]")) el.placeholder = t(el.dataset.i18nPh);
  for (const b of document.querySelectorAll(".langs button")) b.setAttribute("aria-pressed", String(b.dataset.lang === LANG));

  setPaused(PAUSED);
  $("#mode").textContent = FROZEN ? t("m_readonly") : LIVE ? t("m_live") : t("m_dry");
  $("#link").textContent = t(LINK);
  renderRules(RULES);
  renderPositions(POSITIONS);
  renderStats(STATS);
  redrawRows();
  showEmpty();
  if (TOUR_AT >= 0) paintStep();
}

/* The rows carry their event, so the cheapest correct redraw is to build them again.
   It costs a few milliseconds on a switch nobody makes twice a minute. */
function redrawRows() {
  const body = $("#feed");
  const events = rows.map((tr) => tr._e);
  for (const tr of rows) { tr._detach(); tr.remove(); }
  rows.length = 0;
  for (const e of events.reverse()) {
    const tr = launchRow(e);
    if (!matches(e)) tr.hidden = true;
    body.prepend(tr);
    rows.unshift(tr);
  }
}

for (const b of document.querySelectorAll(".langs button")) {
  b.addEventListener("click", () => applyLang(b.dataset.lang));
}

/* ---- the walkthrough -----------------------------------------------------
   Nine stops, each pinned to something real on the page rather than to a screenshot,
   so it cannot drift out of date. It runs itself once on a first visit and lives
   behind the guide button after that. */
const TOUR = [
  { sel: ".mark",                        h: "t1h", p: "t1p" },
  { sel: "#mode",                        h: "t2h", p: "t2p" },
  { sel: ".ribbon",                      h: "t3h", p: "t3p" },
  { sel: 'th[data-i18n="c_score"]',      h: "t4h", p: "t4p" },
  { sel: 'th[data-i18n="c_buy"]',        h: "t5h", p: "t5p" },
  { sel: 'th[data-i18n="c_tax"]',        h: "t6h", p: "t6p" },
  { sel: 'th[data-i18n="c_exempt"]',     h: "t7h", p: "t7p" },
  { sel: "#rules",                       h: "t8h", p: "t8p" },
  { sel: "#toggle",                      h: "t9h", p: "t9p" },
];
let TOUR_AT = -1;

function paintStep() {
  const step = TOUR[TOUR_AT];
  const target = document.querySelector(step.sel);
  const ring = $("#ring"), coach = $("#coach");

  if (target) {
    const r = target.getBoundingClientRect();
    const pad = 6;
    ring.style.top = (r.top - pad) + "px";
    ring.style.left = (r.left - pad) + "px";
    ring.style.width = (r.width + pad * 2) + "px";
    ring.style.height = (r.height + pad * 2) + "px";
    ring.classList.add("on");
    $("#veil").classList.remove("on");
  } else {
    ring.classList.remove("on");
    $("#veil").classList.add("on");
  }

  $("#coach-h").textContent = t(step.h);
  $("#coach-p").textContent = t(step.p);
  $("#coach-n").textContent = t("c_step", { i: TOUR_AT + 1, n: TOUR.length });
  $("#coach-skip").textContent = t("c_skip");
  $("#coach-back").textContent = t("c_back");
  $("#coach-back").hidden = TOUR_AT === 0;
  $("#coach-next").textContent = TOUR_AT === TOUR.length - 1 ? t("c_done") : t("c_next");
  coach.classList.add("on");

  // below the target when there is room for the card, above it when there is not
  const box = coach.getBoundingClientRect();
  const r = target ? target.getBoundingClientRect() : { bottom: innerHeight / 2 - box.height / 2, top: innerHeight / 2 + box.height / 2, left: innerWidth / 2 - 165 };
  const below = r.bottom + 12;
  const top = below + box.height < innerHeight - 12 ? below : Math.max(12, r.top - box.height - 12);
  coach.style.top = top + "px";
  coach.style.left = Math.min(Math.max(12, r.left), innerWidth - box.width - 12) + "px";
}

function tourGo(i) {
  if (i < 0 || i >= TOUR.length) { tourEnd(); return; }
  // a read-only board has no start button, and pointing at nothing is worse than stopping short
  if (FROZEN && TOUR[i].sel === "#toggle") { tourEnd(); return; }
  TOUR_AT = i;
  const target = document.querySelector(TOUR[i].sel);
  if (target) target.scrollIntoView({ block: "nearest", behavior: "smooth" });
  paintStep();
}

function tourEnd() {
  TOUR_AT = -1;
  $("#ring").classList.remove("on");
  $("#veil").classList.remove("on");
  $("#coach").classList.remove("on");
  try { localStorage.setItem("assay.toured", "1"); } catch { /* it will offer itself again */ }
  $("#help").focus();
}

$("#help").addEventListener("click", () => tourGo(0));
$("#coach-next").addEventListener("click", () => tourGo(TOUR_AT + 1));
$("#coach-back").addEventListener("click", () => tourGo(TOUR_AT - 1));
$("#coach-skip").addEventListener("click", tourEnd);
addEventListener("resize", () => { if (TOUR_AT >= 0) paintStep(); });
addEventListener("keydown", (e) => {
  if (TOUR_AT < 0) return;
  if (e.key === "Escape") { e.preventDefault(); tourEnd(); }
  if (e.key === "ArrowRight") { e.preventDefault(); tourGo(TOUR_AT + 1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); tourGo(TOUR_AT - 1); }
}, true);

applyLang(LANG);
boot().then(() => {
  // A first-time reader gets the walkthrough once, after the page has something real on it.
  let toured = "1";
  try { toured = localStorage.getItem("assay.toured") ?? ""; } catch { /* offer it every time, then */ }
  if (!toured) setTimeout(() => tourGo(0), 600);
});
</script>
</body>
</html>
