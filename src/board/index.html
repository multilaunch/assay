<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hoodterm board</title>
<style>
  :root{
    --bg:#0d1117; --panel:#141a22; --panel2:#1a2130; --rule:#232c3a; --rule2:#33405 4;
    --ink:#e6edf3; --ink2:#9aa7b8; --ink3:#5f6c7e;
    --fire:#7ee787; --watch:#e3b341; --skip:#5f6c7e; --bad:#f8836b; --acc:#6cb6ff;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--mono)}
  header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  h1{font-size:14px;margin:0;letter-spacing:.06em}
  .tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:3px;border:1px solid var(--rule2);color:var(--ink2)}
  .tag.live{color:#0d1117;background:var(--bad);border-color:var(--bad);font-weight:700}
  .tag.dry{color:var(--fire);border-color:var(--fire)}
  .spacer{flex:1}
  button{font:inherit;background:var(--panel2);color:var(--ink);border:1px solid var(--rule2);border-radius:4px;padding:4px 10px;cursor:pointer}
  button:hover{border-color:var(--acc);color:var(--acc)}
  button.primary{background:var(--fire);color:#0d1117;border-color:var(--fire);font-weight:700}
  button.stop{background:var(--watch);color:#0d1117;border-color:var(--watch);font-weight:700}
  button:disabled{opacity:.4;cursor:not-allowed}
  input{font:inherit;width:62px;background:var(--bg);color:var(--ink);border:1px solid var(--rule2);border-radius:4px;padding:3px 6px}
  main{display:grid;grid-template-columns:1fr 380px;gap:0;align-items:start}
  @media(max-width:940px){main{grid-template-columns:1fr}}
  #feed{padding:8px 16px 60px;min-height:70vh}
  aside{border-left:1px solid var(--rule);padding:12px 14px 60px;position:sticky;top:47px;max-height:calc(100vh - 47px);overflow:auto}
  @media(max-width:940px){aside{border-left:none;border-top:1px solid var(--rule);position:static;max-height:none}}
  h2{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin:14px 0 8px;font-weight:600}
  h2:first-child{margin-top:0}
  .card{border:1px solid var(--rule);border-left-width:3px;border-radius:5px;background:var(--panel);padding:8px 11px;margin-bottom:6px;cursor:pointer}
  .card:hover{border-color:var(--rule2);border-left-color:var(--acc)}
  .card.FIRE{border-left-color:var(--fire)}
  .card.WATCH{border-left-color:var(--watch)}
  .card.SKIP{border-left-color:var(--skip);opacity:.72}
  .row1{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
  .sym{color:var(--acc);font-weight:600}
  .nm{color:var(--ink2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .score{font-weight:700;min-width:26px;text-align:right}
  .FIRE .score{color:var(--fire)} .WATCH .score{color:var(--watch)} .SKIP .score{color:var(--skip)}
  .bar{height:3px;background:var(--rule);border-radius:2px;margin:5px 0 4px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--acc)}
  .meta{color:var(--ink3);font-size:11.5px;display:flex;gap:12px;flex-wrap:wrap}
  .why{color:var(--watch);font-size:11.5px;margin-top:3px}
  .bad{color:var(--bad)}
  .ok{color:var(--fire)}
  .drawer{margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule2);font-size:11.5px;color:var(--ink2);display:none}
  .card.open .drawer{display:block}
  .drawer div{margin:2px 0}
  .drawer a{color:var(--acc)}
  .pos{border:1px solid var(--rule);border-radius:5px;background:var(--panel);padding:7px 10px;margin-bottom:5px}
  .pos .top{display:flex;align-items:baseline;gap:8px}
  .rule{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:11.5px;color:var(--ink2)}
  .rule label{flex:1}
  #log{font-size:11px;color:var(--ink3);max-height:150px;overflow:auto}
  #log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--skip)}
  .pulse.on{background:var(--fire)}
  .empty{color:var(--ink3);padding:20px 0}
</style>
</head>
<body>
<header>
  <h1>hoodterm</h1>
  <span class="tag" id="mode">…</span>
  <span class="tag" id="state">paused</span>
  <span class="spacer"></span>
  <span class="pulse" id="pulse" title="engine heartbeat"></span>
  <span id="spent" class="tag">0 spent</span>
  <button id="toggle" class="primary">start</button>
</header>

<main>
  <section id="feed"><div class="empty">waiting for the first launch…</div></section>
  <aside>
    <h2>positions</h2>
    <div id="positions"><div class="empty">none</div></div>
    <h2>rules</h2>
    <div id="rules"></div>
    <h2>log</h2>
    <div id="log"></div>
  </aside>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
let LIVE = false, PAUSED = true, BOUNDS = {};

function logLine(t) {
  const d = document.createElement("div");
  d.textContent = `${new Date().toTimeString().slice(0, 8)}  ${t}`;
  $("#log").prepend(d);
  while ($("#log").childElementCount > 80) $("#log").lastElementChild.remove();
}

function launchCard(e) {
  const el = document.createElement("div");
  el.className = `card ${e.verdict}`;
  const pct = e.progress != null ? Math.round(e.progress * 100) : 0;
  const dev = e.devPct != null ? `${e.devPct.toFixed(2)}%` : "?";
  const tax = e.taxBps != null ? `${e.taxBps / 100}%` : "?";
  const ex = e.exempt ? e.exempt.length : "?";
  const devCls = e.devPct == null ? "bad" : e.devPct > 10 ? "bad" : e.devPct >= 1 && e.devPct <= 6 ? "ok" : "";
  const exCls = e.exempt == null ? "bad" : e.exempt.length > 3 ? "bad" : "";
  el.innerHTML = `
    <div class="row1">
      <span class="sym">${esc(e.symbol ? "$" + e.symbol : e.token.slice(0, 10))}</span>
      <span class="nm">${esc(e.name)}</span>
      ${e.fire ? '<span class="tag dry">fire</span>' : ""}
      <span class="score">${e.score}</span>
    </div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="meta">
      <span>buy <b class="${devCls}">${dev}</b></span>
      <span>tax <b>${tax}</b></span>
      <span>exempt <b class="${exCls}">${ex}</b></span>
      <span>${esc(e.pair)}</span>
      <span>${pct}%</span>
      ${e.farmTwins ? `<span class="bad">farm ×${e.farmTwins}</span>` : ""}
      ${e.deployerPrior != null ? `<span>dev ${e.deployerPrior}/${e.deployerGraduated}</span>` : ""}
    </div>
    ${e.why && e.why.length ? `<div class="why">${esc(e.why.join(" · "))}</div>` : ""}
    <div class="drawer">
      ${e.description ? `<div>${esc(e.description)}</div>` : ""}
      <div>${(e.reasons || []).map(esc).join(" · ")}</div>
      ${e.flags && e.flags.length ? `<div class="bad">${esc(e.flags.join(" · "))}</div>` : ""}
      <div>deployer ${esc(e.deployer)}</div>
      ${e.feeRecipient ? `<div>fees → ${e.feeToDeployer ? "deployer" : `<span class="bad">third party</span> ${esc(e.feeRecipient)}`}</div>` : ""}
      ${e.exempt && e.exempt.length ? `<div>exempt: ${e.exempt.map(esc).join(", ")}</div>` : ""}
      <div><a href="${esc(e.links.pons)}" target="_blank" rel="noopener">pons</a> · <a href="${esc(e.links.explorer)}" target="_blank" rel="noopener">explorer</a> · read ${e.readMs} ms</div>
      ${e.errors && e.errors.length ? `<div class="bad">${esc(e.errors.join(" · "))}</div>` : ""}
    </div>`;
  el.addEventListener("click", () => el.classList.toggle("open"));
  return el;
}

function addLaunch(e) {
  const feed = $("#feed");
  const empty = feed.querySelector(".empty");
  if (empty) empty.remove();
  feed.prepend(launchCard(e));
  while (feed.childElementCount > 150) feed.lastElementChild.remove();
}

function renderPositions(list) {
  const box = $("#positions");
  if (!list.length) { box.innerHTML = '<div class="empty">none</div>'; return; }
  box.innerHTML = "";
  for (const p of [...list].reverse()) {
    const el = document.createElement("div");
    el.className = "pos";
    const cls = p.pnlPct >= 0 ? "ok" : "bad";
    el.innerHTML = `
      <div class="top">
        <span class="sym">$${esc(p.symbol)}</span>
        <span class="${cls}">${p.pnlPct >= 0 ? "+" : ""}${p.pnlPct.toFixed(1)}%</span>
        <span class="spacer"></span>
        <span class="tag">${p.status}${p.dryRun ? " dry" : ""}</span>
      </div>
      ${p.status === "open" ? `<div style="margin-top:5px"><button data-close="${esc(p.id)}">close now</button></div>` : ""}
      ${p.exits.map((x) => `<div class="meta">exit: ${esc(x.reason)}</div>`).join("")}`;
    box.append(el);
  }
  box.querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", async () => {
    b.disabled = true;
    const r = await fetch("/close", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: b.dataset.close }) }).then((x) => x.json());
    logLine(r.ok ? `closed: ${(r.pnlPct >= 0 ? "+" : "") + r.pnlPct.toFixed(1)}% on ${r.venue}` : `close failed: ${r.error}`);
  }));
}

function renderRules(rules) {
  const box = $("#rules");
  box.innerHTML = "";
  for (const [key, value] of Object.entries(rules)) {
    const b = BOUNDS[key] || { min: 0, max: 1000 };
    const row = document.createElement("div");
    row.className = "rule";
    row.innerHTML = `<label for="r-${key}">${esc(key)}</label><input id="r-${key}" type="number" min="${b.min}" max="${b.max}" value="${value}">`;
    row.querySelector("input").addEventListener("change", async (ev) => {
      const r = await fetch("/rule", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ key, value: Number(ev.target.value) }) }).then((x) => x.json());
      if (r.ok) { ev.target.value = r.value; logLine(`${key} → ${r.value}`); } else logLine(`rule refused: ${r.error}`);
    });
    box.append(row);
  }
}

function setPaused(p) {
  PAUSED = p;
  $("#state").textContent = p ? "paused" : LIVE ? "armed" : "running";
  const b = $("#toggle");
  b.textContent = p ? (LIVE ? "arm live" : "start") : "stop";
  b.className = p ? "primary" : "stop";
}

$("#toggle").addEventListener("click", async () => {
  const to = PAUSED ? "/resume" : "/pause";
  const r = await fetch(to, { method: "POST" }).then((x) => x.json());
  setPaused(r.paused);
});

async function boot() {
  const s = await fetch("/state").then((r) => r.json());
  LIVE = s.live; BOUNDS = s.bounds;
  $("#mode").textContent = LIVE ? "LIVE" : "dry run";
  $("#mode").className = `tag ${LIVE ? "live" : "dry"}`;
  setPaused(s.paused);
  renderRules(s.rules);
  renderPositions(s.positions);
  for (const e of s.recent) if (e.kind === "launch") addLaunch(e);
  logLine("connected");

  const src = new EventSource("/events");
  src.onmessage = (m) => {
    const e = JSON.parse(m.data);
    if (e.kind === "launch") addLaunch(e);
    else if (e.kind === "positions") renderPositions(e.positions);
    else if (e.kind === "pulse") {
      $("#pulse").classList.add("on");
      setTimeout(() => $("#pulse").classList.remove("on"), 600);
      $("#spent").textContent = `${(Number(e.spent) / 1e18).toFixed(4)} spent · ${e.open} open`;
    }
    else if (e.kind === "state") setPaused(e.paused);
    else if (e.kind === "fire") logLine(`FIRE ${e.symbol} at tax ${(e.taxBps / 100).toFixed(2)}% after ${e.waitedMs} ms`);
    else if (e.kind === "exit") logLine(`exit ${e.symbol} ${(e.pnlPct >= 0 ? "+" : "") + e.pnlPct.toFixed(1)}%: ${e.reason}`);
    else if (e.kind === "hold") logLine(`hold ${e.symbol}: tax still ${(e.taxBps / 100).toFixed(1)}%`);
    else if (e.kind === "swept") logLine(`${e.symbol}: between the curve and the pool`);
    else if (e.kind === "index") logLine(`deployer index: ${e.launches} launches, ${e.graduations} graduations`);
    else if (e.kind === "error") logLine(`error ${e.where}: ${e.message}`);
  };
  src.onerror = () => logLine("stream dropped, reconnecting…");
}

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "p") $("#toggle").click();
});

boot();
</script>
</body>
</html>
